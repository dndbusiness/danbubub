<title>הר-אל CRM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  /* Design tokens — UIUX §2.1 של מערכת הכספים. ודאות היא צבע (§1.2). */
  :root {
    --bg: #F7F8FA; --surface: #FFFFFF; --sunk: #F1F3F6; --border: #E6E8EC;
    --text: #111827; --text-2: #6B7280; --text-3: #9CA3AF;
    --actual: #16A34A;    --actual-bg: #ECFDF5;
    --committed: #2563EB; --committed-bg: #EFF6FF;
    --expected: #F59E0B;  --expected-bg: #FFFBEB;
    --open: #DC2626;      --open-bg: #FEF2F2;
    --p-urgent: #DC2626; --p-high: #F97316; --p-normal: #EAB308; --p-low: #16A34A; /* קו בצד המשימה לפי עדיפות (דן, 11/10) */
    --locked: #6B7280;    --locked-bg: #F3F4F6;
    --finance: #7C3AED; --finance-bg: #F5F3FF;
    --realestate: #0F766E; --realestate-bg: #F0FDFA;
    --dan: #1C6B58; --hadas: #8A3566; --nissim: #2A5A96;
    --radius-card: 12px; --radius-btn: 8px;
    --shadow-card: 0 1px 2px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.06);
    --shadow-pop: 0 12px 32px rgba(17,24,39,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0B0F17; --surface: #111827; --sunk: #0E1420; --border: #1F2937;
      --text: #F3F4F6; --text-2: #9CA3AF; --text-3: #6B7280;
      --actual: #4ADE80;    --actual-bg: #052E16;
      --committed: #60A5FA; --committed-bg: #0C1E3A;
      --expected: #FBBF24;  --expected-bg: #2E1F05;
      --open: #F87171;      --open-bg: #3B0A0A;
      --p-urgent: #F87171; --p-high: #FB923C; --p-normal: #FACC15; --p-low: #4ADE80;
      --locked: #9CA3AF;    --locked-bg: #1F2937;
      --finance: #A78BFA; --finance-bg: #1E1636;
      --realestate: #2DD4BF; --realestate-bg: #042F2B;
      --dan: #4FB99C; --hadas: #D582AD; --nissim: #82B0E0;
      --shadow-card: 0 1px 2px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.5);
      --shadow-pop: 0 12px 32px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0B0F17; --surface: #111827; --sunk: #0E1420; --border: #1F2937;
    --text: #F3F4F6; --text-2: #9CA3AF; --text-3: #6B7280;
    --actual: #4ADE80;    --actual-bg: #052E16;
    --committed: #60A5FA; --committed-bg: #0C1E3A;
    --expected: #FBBF24;  --expected-bg: #2E1F05;
    --open: #F87171;      --open-bg: #3B0A0A;
    --p-urgent: #F87171; --p-high: #FB923C; --p-normal: #FACC15; --p-low: #4ADE80;
    --locked: #9CA3AF;    --locked-bg: #1F2937;
    --finance: #A78BFA; --finance-bg: #1E1636;
    --realestate: #2DD4BF; --realestate-bg: #042F2B;
    --dan: #4FB99C; --hadas: #D582AD; --nissim: #82B0E0;
    --shadow-card: 0 1px 2px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.5);
    --shadow-pop: 0 12px 32px rgba(0,0,0,.6);
  }

  body { direction: rtl; background: var(--bg); color: var(--text); font-family: Heebo, "Segoe UI", system-ui, sans-serif; font-size: 14px; line-height: 1.5; }
  .num { font-variant-numeric: tabular-nums; }
  button, input, select, textarea { font: inherit; color: inherit; }

  header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); border-bottom: 1px solid var(--border); }
  .topin { max-width: 1280px; margin-inline: auto; padding: 10px 16px 0; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  .mark { display: flex; align-items: baseline; gap: 8px; }
  .mark b { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  .who { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); }
  .who img, .av { width: 22px; height: 22px; border-radius: 50%; flex: none; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); background: var(--sunk); border-radius: 999px; padding: 4px 10px; }
  .status i { width: 7px; height: 7px; border-radius: 50%; background: var(--locked); }
  .status.live i { background: var(--actual); }
  .status.err i { background: var(--open); }
  .push { margin-inline-start: auto; }
  .divs { display: inline-flex; background: var(--sunk); border-radius: var(--radius-btn); padding: 2px; }
  .divs button { border: 0; background: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--text-2); }
  .divs[hidden], .divs button[hidden] { display: none !important; }
  nav.tabs button[hidden] { display: none !important; }
  .divs button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-card); font-weight: 600; }

  nav.tabs { display: flex; gap: 2px; overflow-x: auto; max-width: 1280px; margin-inline: auto; padding: 4px 12px 0; scrollbar-width: none; }
  nav.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--text-2); font-size: 14px; padding: 8px 11px; cursor: pointer; white-space: nowrap; }
  nav.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--finance); font-weight: 600; }
  :focus-visible { outline: 2px solid var(--committed); outline-offset: 2px; }
  .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-inline-start: 4px; border-radius: 999px; background: var(--open-bg); color: var(--open); font-size: 11px; font-weight: 600; text-align: center; }

  main { max-width: 1280px; margin-inline: auto; padding-inline: 16px; padding-block: 16px 64px; display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .grow { flex: 1 1 auto; }
  h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  h2 { font-size: 15px; margin: 0; font-weight: 600; }
  h3.sec { font-size: 12px; margin: 10px 0 4px; font-weight: 600; color: var(--text-2); letter-spacing: .02em; }
  .hint { font-size: 12px; color: var(--text-3); margin: 2px 0 0; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: 14px; }
  .card > header { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-bottom: 10px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .grid2 > *, .grid3 > *, .grid4 > * { min-width: 0; }
  @media (max-width: 960px) { .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid2 { grid-template-columns: 1fr; } }
  @media (max-width: 700px) { .grid3 { grid-template-columns: 1fr; } }

  .kpi { display: flex; flex-direction: column; gap: 4px; }
  .kpi h3 { margin: 0; font-size: 12.5px; font-weight: 500; color: var(--text-2); }
  .kpi .v { font-size: 25px; font-weight: 700; line-height: 1.15; }
  .kpi .sub { font-size: 12px; color: var(--text-3); }
  .kpi.click { cursor: pointer; }
  .kpi.click:hover { border-color: var(--text-3); }

  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 7px 8px; text-align: start; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: middle; }
  thead th { color: var(--text-2); font-weight: 500; font-size: 12px; }
  tbody tr:hover { background: var(--sunk); }
  tbody tr.clickable { cursor: pointer; }
  tfoot td { font-weight: 600; border-top: 2px solid var(--border); border-bottom: 0; }
  td.wide { white-space: normal; min-width: 160px; }
  .empty { color: var(--text-3); font-size: 13px; padding: 16px 4px; text-align: center; }

  .pill { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 11.5px; line-height: 1.7; white-space: nowrap; }
  .pill.actual { background: var(--actual-bg); color: var(--actual); }
  .pill.committed { background: var(--committed-bg); color: var(--committed); }
  .pill.expected { background: var(--expected-bg); color: var(--expected); }
  .pill.open { background: var(--open-bg); color: var(--open); }
  .pill.locked { background: var(--locked-bg); color: var(--locked); }
  .tlist { display: flex; flex-direction: column; }
  .trow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .trow:last-child { border-bottom: 0; }
  .tname { flex: 1 1 200px; min-width: 0; }
  .tfields { display: flex; flex-wrap: wrap; gap: 6px; flex: 2 1 260px; }
  .tfields .f { flex: 1 1 130px; min-width: 0; }
  .pill.muted { background: var(--sunk); color: var(--text-2); box-shadow: inset 0 0 0 1px var(--border); }
  .pill.finance { background: var(--finance-bg); color: var(--finance); }
  .pill.realestate { background: var(--realestate-bg); color: var(--realestate); }
  .tag { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; font-size: 12px; line-height: 1.8; background: var(--surface); cursor: default; }
  .tag button { border: 0; background: none; padding: 0; cursor: pointer; color: var(--text-3); font-size: 13px; line-height: 1; }
  .tag button:hover { color: var(--open); }
  button.tag { cursor: pointer; }

  .m { white-space: nowrap; }
  .m.actual { color: var(--actual); } .m.committed { color: var(--committed); } .m.expected { color: var(--expected); }
  .m.open { color: var(--open); } .m.locked { color: var(--locked); } .m.muted { color: var(--text); }

  .btn { border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius-btn); padding: 6px 12px; cursor: pointer; font-size: 13px; white-space: nowrap; }
  .btn:hover { background: var(--sunk); }
  .btn.primary { background: var(--text); color: var(--surface); border-color: var(--text); }
  .btn.primary:hover { opacity: .9; }
  .btn.go { background: var(--actual); color: #fff; border-color: var(--actual); }
  .btn.small { padding: 3px 9px; font-size: 12px; }
  .btn.ghost { border-color: transparent; background: none; }
  .btn.danger { color: var(--open); }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .xlink { appearance: none; background: none; border: 0; padding: 0; cursor: pointer; text-align: start; text-decoration: underline; text-decoration-color: var(--text-3); text-underline-offset: 3px; }
  .xlink:hover { color: var(--committed); text-decoration-color: var(--committed); }

  input.f, select.f, textarea.f { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-btn); padding: 6px 10px; font-size: 13px; min-width: 0; }
  textarea.f { resize: vertical; min-height: 60px; width: 100%; }
  .search { flex: 1 1 220px; }
  label.fl { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--text-2); }
  label.fl > .f { color: var(--text); font-size: 14px; }
  .form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
  .form .full { grid-column: 1 / -1; }
  @media (max-width: 560px) { .form { grid-template-columns: 1fr; } }

  .scrim { position: fixed; inset: 0; background: rgba(15,23,42,.35); z-index: 50; display: flex; justify-content: flex-start; }
  .drawer { background: var(--surface); width: min(560px, 100%); height: 100%; overflow-y: auto; box-shadow: var(--shadow-pop);
            padding: calc(16px + env(safe-area-inset-top, 0px)) 18px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
  .drawer header { display: flex; align-items: center; gap: 8px; }
  .drawer footer { display: flex; gap: 8px; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); }

  .ccard-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-start; }
  .ccard-head h1 { font-size: 24px; }
  .moneystrip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid var(--border); border-radius: var(--radius-card); overflow: hidden; background: var(--surface); }
  .moneystrip > div { padding: 12px 14px; border-inline-start: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .moneystrip > div:first-child { border-inline-start: 0; }
  .moneystrip span { font-size: 12px; color: var(--text-2); }
  .moneystrip b { font-size: 19px; }
  @media (max-width: 760px) { .moneystrip { grid-template-columns: repeat(2, minmax(0, 1fr)); } .moneystrip > div { border-inline-start: 0; border-top: 1px solid var(--border); } }
  .check { display: flex; align-items: center; gap: 10px; padding: 7px 4px; border-bottom: 1px solid var(--border); }
  .check:last-child { border-bottom: 0; }
  .check input, input.cb { width: 17px; height: 17px; accent-color: var(--actual); flex: none; }
  .check.done span { color: var(--text-3); text-decoration: line-through; }
  .log { display: flex; flex-direction: column; gap: 10px; padding: 0; margin: 0; }
  .log li { list-style: none; display: grid; grid-template-columns: 78px 1fr; gap: 8px; font-size: 13px; }
  .log time { color: var(--text-3); font-size: 12px; }
  .log .auto { color: var(--text-2); }
  .proc .psteps { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
  .pstep { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 3px 10px 3px 4px; font-size: 12.5px; cursor: pointer; color: var(--text-2); }
  .pstep i { font-style: normal; width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; background: var(--sunk); color: var(--text-2); }
  .pstep small { color: var(--text-3); font-size: 10.5px; }
  .pstep.done i { background: var(--actual-bg); color: var(--actual); } .pstep.done { color: var(--text); }
  .pstep.cur { border-color: var(--committed); color: var(--text); font-weight: 600; } .pstep.cur i { background: var(--committed); color: var(--surface); }
  .pstep.sel { box-shadow: 0 0 0 2px var(--committed-bg); background: var(--sunk); }
  .ppanel { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .ppanel h3.sec { margin-top: 0; }
  .kvs { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px 10px; } .kvs > div { display: flex; flex-direction: column; } .kvs b { font-size: 15px; }
  .tranche { border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
  details.pside { margin-top: 10px; } details.pside > summary { cursor: pointer; font-size: 13px; color: var(--text-2); }
  .progress { height: 6px; border-radius: 999px; background: var(--sunk); overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--actual); }

  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(210px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 4px; }
  .col { background: var(--sunk); border-radius: var(--radius-card); padding: 8px; display: flex; flex-direction: column; gap: 8px; min-height: 110px; }
  .col h3 { margin: 0; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; padding: 2px 4px; }
  .lead { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .lead .meta { font-size: 12px; color: var(--text-3); }

  .bars { display: flex; flex-direction: column; gap: 8px; }
  .bar { display: grid; grid-template-columns: 130px 1fr 110px; gap: 10px; align-items: center; font-size: 13px; }
  .bar .track { height: 10px; background: var(--sunk); border-radius: 999px; overflow: hidden; }
  .bar .track i { display: block; height: 100%; border-radius: 999px; }
  @media (max-width: 520px) { .bar { grid-template-columns: 90px 1fr 90px; } }

  .day { display: flex; flex-direction: column; gap: 12px; }
  .dayhead { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px; border-radius: var(--radius-card); border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow-card); }
  .dayhead .big { font-size: 22px; font-weight: 700; }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; }
  .steps span { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--sunk); color: var(--text-2); }
  .steps span.on { background: var(--text); color: var(--surface); }
  .qa { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .qa .q { font-size: 13px; }

  .toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); inset-inline-start: 16px; z-index: 60; background: var(--text); color: var(--surface); border-radius: 10px; padding: 9px 14px; font-size: 13px; box-shadow: var(--shadow-pop); max-width: calc(100% - 32px); }
  .notice { display: flex; gap: 10px; align-items: flex-start; border-radius: var(--radius-card); padding: 10px 12px; font-size: 13px; border: 1px solid; }
  .notice.warn { background: var(--expected-bg); border-color: var(--expected); }
  .notice.bad { background: var(--open-bg); border-color: var(--open); }
  .notice.info { background: var(--committed-bg); border-color: var(--committed); }
  .intake .fl { min-width: 0; } table.obl input.f{width:100%;min-width:80px} table.obl tr.tot td{font-weight:700;background:var(--sunk)}
  .intake textarea.f { width: 100%; }
  .notice.ok { background: var(--actual-bg); border-color: var(--actual); }
  .notice b { flex: none; }
  .seg { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .seg button { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 3px 11px; font-size: 12.5px; cursor: pointer; color: var(--text-2); }
  .seg button[aria-pressed="true"] { background: var(--text); color: var(--surface); border-color: var(--text); }
  .emailprev { border: 1px solid var(--border); border-radius: 10px; padding: 14px; background: var(--bg); max-height: 420px; overflow: auto; font-size: 13px; }
  @media (max-width: 480px) { .grid4 { gap: 8px; } .grid4 > .kpi { padding: 12px; } .grid4 .kpi .v { font-size: 19px; overflow-wrap: anywhere; } .grid4 .kpi .sub { font-size: 11.5px; } th, td { padding: 6px 5px; } td.wide { min-width: 110px; } }
  .rchip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 1px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .r-dan { --lane: var(--dan); } .r-hadas { --lane: var(--hadas); } .r-nissim { --lane: var(--nissim); }
  .rchip.r-dan, .rchip.r-hadas, .rchip.r-nissim { color: var(--lane); }
  .tcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px; }
.tcard { margin: 0; }
.tcard .row { flex-wrap: wrap; gap: 6px; }
.lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; align-items: start; }
  .lane:not(.r-dan):not(.r-hadas):not(.r-nissim) { --lane: var(--committed); }
  @media (max-width: 960px) { .lanes { grid-template-columns: 1fr; } }
  .lane { background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--lane); border-radius: var(--radius-card); box-shadow: var(--shadow-card); overflow: hidden; }
  .lane > header { display: flex; align-items: baseline; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--sunk); flex-wrap: wrap; }
  .lane > header h3 { margin: 0; font-size: 15px; }
  .lane .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--lane); align-self: center; }
  ul.blocks { list-style: none; margin: 0; padding: 0; }
  .v.p-urgent { color: var(--p-urgent); } .v.p-normal { color: var(--p-normal); } .v.p-low { color: var(--p-low); }
  .dchips { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 12px; }
  .dchip { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); cursor: pointer; }
  .dchip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .dchip .num { opacity: .7; margin-inline-start: 2px; }
  .dsec { margin-bottom: 14px; }
  .dgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 10px; margin-top: 6px; }
  .dtile { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 6px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); min-width: 0; }
  .dtile.on { border-color: var(--committed); box-shadow: 0 0 0 1px var(--committed); }
  .dthumb { display: flex; align-items: center; justify-content: center; aspect-ratio: 3 / 4; border-radius: 6px; background: var(--sunk); overflow: hidden; text-decoration: none; }

  /* שריון (הכנה לחודש הבא, אם מחליטים): יורד לפני החלוקה ומשתחרר בחודש שאחריו. */

    const rest = c.status === 'won' ? r2(clientMoney(c).open - insts.reduce((a, i) => a + instNet(i), 0)) : 0;
    if (rest > 0) out.push({ date: c.expectedPayDate || null, amount: r2(rest * (c.vatExempt ? 1 : 1 + VATR())), label: 'יתרת שכ״ט (כולל מע״מ)', c });
  });
  return out.sort((a, b) => String(a.date || '9999').localeCompare(String(b.date || '9999')));
}

  const csv = '﻿' + [head, ...rows].map((r) => r.map(cell).join(',')).join('\r\n');

}

function reportMail(kind, ref) {

  const html = mailWrap(title, '<p>נגבה <b>' + plain(r.incomeSum) + '</b> · הוצאות <b>' + plain(r.expenseSum) + '</b> · ' + r.won.length + ' תיקים נסגרו · ' + r.tasksDone.length + ' משימות בוצעו · ' + r.leads.length + ' לידים חדשים</p>' +

    '<h3 style="font-size:14px">תנועה בתיקים</h3>' + mailTable(['תאריך', 'לקוח', 'שינוי'], r.moves.slice(0, 40).map((x) => [dLabel(dayOf(x.e.at)), esc(x.c.name), esc(x.e.text)])) +
    '<h3 style="font-size:14px">הצוות</h3>' + mailTable(['אחראי', 'תיקים פתוחים', 'משימות שבוצעו', 'בזמן', 'נגבה'], ts.map((x) => [esc(nameOf(x.u)), String(x.open), String(x.done), x.done ? x.onTimePct + '%' : '—', plain(x.collected)])));

async function mailReport(kind) {

async function parseBankFile(file) {

  const numv = (v) => typeof v === 'number' ? v : Number(String(v || '').replace(/[^\d.\-]/g, '')) || 0;
  const out = [];
  for (const r of rows.slice(hi + 1)) {
    const d = r[cD] instanceof Date ? isoOf(r[cD]) : dateOf(r[cD]); if (!d) continue;
    const amount = r2(cAmt >= 0 ? numv(r[cAmt]) : numv(r[cCr]) - Math.abs(numv(r[cDr]))); if (!amount) continue;
    out.push({ date: d, desc: String(r[cDesc] ?? '').trim(), amount, balance: cBal >= 0 && r[cBal] !== '' ? numv(r[cBal]) : null });
  }
  const used = new Set();
  const txs = live(S.transactions);
  for (const x of out) {
    const hit = txs.find((t) => !used.has(t.id) && Math.abs(Math.abs(n(t.gross || t.net)) - Math.abs(x.amount)) <= 1 && Math.sign(n(t.net)) === Math.sign(x.amount) && Math.abs(daysBetween(t.date, x.date)) <= 5);
    if (hit) { used.add(hit.id); x.match = hit.id; }
  }

  const last = withBal[withBal.length - 1];
  S.bank = { fileName: file.name, rows: out.sort((a, b) => String(b.date).localeCompare(a.date)), lastBalance: last ? last.balance : null, lastDate: last ? last.date : null };
  render();
}

  const cw = user && user.can ? await user.can('data.write').catch(() => null) : null;
