  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ght: 700;\n  font-display: swap;\n  src: url(\"b21261ee-7d38-4330-b359-d600b0c266a5\") format('woff2');\n  unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;\n}\n@font-face {\n  font-family: 'Heebo';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"c3614c7a-74fd-4d9c-9af4-7b1c404cb803\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212;\n}\n\n/* ---- 800 ExtraBold ---- */\n@font-face {\n  font-family: 'Heebo';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"92beb871-5e32-4108-8f45-7547fdc6970d\") format('woff2');\n  unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;\n}\n@font-face {\n  font-family: 'Heebo';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"61e60211-d086-4a2e-ae38-8804376d2668\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212;\n}\n\n/* ---- 900 Black ---- */\n@font-face {\n  font-family: 'Heebo';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"4c7c99a1-bb09-4e1f-8e5b-0b0fcc8dfe88\") format('woff2');\n  unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;\n}\n@font-face {\n  font-family: 'Heebo';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"87348bc1-f361-4f97-8260-013eaa448e0b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212;\n}\n\n/* ============================================================\n   COLORS — Harel Invest (הראל השקעות חכמות בנדל\"ן)\n   Derived from the live brand: teal primary (#26AFA4),\n   deep teal-navy ink (#071D26), gold accent (#D4AF37).\n   Base ramps first, then semantic aliases.\n   ============================================================ */\n\n:root {\n  /* ---------- Brand teal ramp (primary) ---------- */\n  --teal-50:  #EEF7F7;   /* map / section tint */\n  --teal-100: #D9F0EE;\n  --teal-200: #A8D8D8;   /* brand light */\n  --teal-300: #79C8C2;\n  --teal-400: #45BAB0;\n  --teal-500: #26AFA4;   /* ★ BRAND PRIMARY */\n  --teal-600: #1F968C;   /* hover */\n  --teal-700: #217C71;   /* brand dark / press */\n  --teal-800: #1A5F58;\n  --teal-900: #123F3A;\n\n  /* ---------- Ink — deep teal-navy ramp (the brand \"black\") ---------- */\n  --ink-950: #04141A;\n  --ink-900: #071D26;    /* ★ BRAND DARK (headers, footer, text) */\n  --ink-800: #0E2A33;\n  --ink-700: #16363F;\n  --ink-600: #21454F;\n\n  /* ---------- Gold accent ramp ---------- */\n  --gold-300: #E8D38A;\n  --gold-400: #DDC264;\n  --gold-500: #D4AF37;   /* ★ BRAND ACCENT */\n  --gold-600: #B8932A;\n  --gold-700: #94751F;\n\n  /* ---------- Neutrals (cool grey) ---------- */\n  --white:    #FFFFFF;\n  --grey-50:  #F8F9FA;   /* app background */\n  --grey-100: #F1F3F5;\n  --grey-200: #E6EAED;   /* hairline borders */\n  --grey-300: #D2D8DD;   /* default borders */\n  --grey-400: #AEB6BD;\n  --grey-500: #828D95;\n  --grey-600: #5C666E;\n  --grey-700: #3F4850;\n  --grey-800: #272E34;\n  --grey-900: #141A1F;\n\n  /* ---------- Status / semantic hues ---------- */\n  --positive-500: #18A05B;  /* gains, \"potential profit\" up */\n  --positive-50:  #E7F6EE;\n  --warning-500:  #D35400;  /* \"ready / last apartments\" category */\n  --warning-50:   #FCEEE3;\n  --danger-500:   #E1493B;  /* video / destructive */\n  --danger-50:    #FCEAE8;\n  --info-500:     var(--teal-500);\n\n  /* ============================================================\n     SEMANTIC ALIASES — reach for these in product code\n     ============================================================ */\n\n  /* Surfaces */\n  --surface-page:     var(--grey-50);\n  --surface-card:     var(--white);\n  --surface-sunken:   var(--grey-100);\n  --surface-tint:     var(--teal-50);   /* map canvas, soft teal panels */\n  --surface-inverse:  var(--ink-900);   /* dark sections, header bar option */\n  --surface-overlay:  rgba(7, 29, 38, 0.55); /* modal scrim */\n\n  /* Text */\n  --text-primary:   var(--ink-900);\n  --text-secondary: var(--grey-700);\n  --text-muted:     var(--grey-500);\n  --text-inverse:   var(--white);\n  --text-on-teal:   var(--white);\n  --text-brand:     var(--teal-700);\n  --text-accent:    var(--gold-600);\n  --text-positive:  var(--positive-500);\n\n  /* Brand actions */\n  --brand-primary:        var(--teal-500);\n  --brand-primary-hover:  var(--teal-600);\n  --brand-primary-press:  var(--teal-700);\n  --brand-dark:           var(--ink-900);\n  --brand-dark-hover:     var(--ink-800);\n  --brand-accent:         var(--gold-500);\n  --brand-accent-hover:   var(--gold-600);\n\n  /* Borders & lines */\n  --border-subtle:  var(--grey-200);\n  --border-default: var(--grey-300);\n  --border-strong:  var(--grey-400);\n  --border-brand:   var(--teal-500);\n  --border-focus:   var(--teal-600);\n\n  /* Gradients (brand signatures) */\n  --gradient-teal:    linear-gradient(135deg, #2ECBC0 0%, #26AFA4 55%, #1F968C 100%); /* @kind color */\n  --gradient-ink:     linear-gradient(160deg, #0E2A33 0%, #071D26 100%); /* @kind color */\n  --gradient-chevron: linear-gradient(180deg, #A8D8D8 0%, #26AFA4 50%, #217C71 100%); /* @kind color */\n  --gradient-gold:    linear-gradient(135deg, #E8D38A 0%, #D4AF37 100%); /* @kind color */\n\n  /* Focus ring */\n  --ring: 0 0 0 3px rgba(38, 175, 164, 0.35);\n}\n\n/* ============================================================\n   TYPOGRAPHY — Harel Invest\n   Single family: Heebo. Hebrew-first, RTL-native.\n   ============================================================ */\n\n:root {\n  /* ---------- Families ---------- */\n  --font-sans: 'Heebo', 'Segoe UI', Arial, sans-serif;\n  --font-display: 'Heebo', 'Segoe UI', Arial, sans-serif; /* heavy weights */\n  --font-numeric: 'Heebo', 'SF Mono', ui-monospace, monospace;\n\n  /* ---------- Weights ---------- */\n  --fw-light: 300;    /* @kind font */\n  --fw-regular: 400;  /* @kind font */\n  --fw-medium: 500;   /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold: 700;     /* @kind font */\n  --fw-extrabold: 800;/* @kind font */\n  --fw-black: 900;    /* @kind font */\n\n  /* ---------- Type scale (px → rem, base 16) ---------- */\n  --text-2xs: 0.6875rem;  /* 11 — micro labels */\n  --text-xs:  0.75rem;    /* 12 — captions, meta */\n  --text-sm:  0.875rem;   /* 14 — secondary body, list items */\n  --text-base:1rem;       /* 16 — body */\n  --text-md:  1.125rem;   /* 18 — lead body */\n  --text-lg:  1.375rem;   /* 22 — card titles */\n  --text-xl:  1.75rem;    /* 28 — section titles */\n  --text-2xl: 2.25rem;    /* 36 — page headings */\n  --text-3xl: 3rem;       /* 48 — display */\n  --text-4xl: 3.875rem;   /* 62 — hero display */\n\n  /* ---------- Line heights ---------- */\n  --leading-tight: 1.12;   /* @kind font */\n  --leading-snug: 1.28;    /* @kind font */\n  --leading-normal: 1.5;   /* @kind font */\n  --leading-relaxed: 1.7;  /* @kind font */\n\n  /* ---------- Letter spacing (Hebrew wants near-zero; tighten display) ---------- */\n  --tracking-tight: -0.02em; /* @kind font */\n  --tracking-normal: 0;      /* @kind font */\n  --tracking-wide: 0.04em;   /* @kind font */\n}\n\n/* ============================================================\n   SPACING · RADII · SHADOWS · MOTION — Harel Invest\n   ============================================================ */\n\n:root {\n  /* ---------- Spacing (4px base) ---------- */\n  --space-0: 0;\n  --space-1: 0.25rem;   /* 4  */\n  --space-2: 0.5rem;    /* 8  */\n  --space-3: 0.75rem;   /* 12 */\n  --space-4: 1rem;      /* 16 */\n  --space-5: 1.25rem;   /* 20 */\n  --space-6: 1.5rem;    /* 24 */\n  --space-8: 2rem;      /* 32 */\n  --space-10: 2.5rem;   /* 40 */\n  --space-12: 3rem;     /* 48 */\n  --space-16: 4rem;     /* 64 */\n  --space-20: 5rem;     /* 80 */\n  --space-24: 6rem;     /* 96 */\n\n  /* ---------- Radii ---------- */\n  --radius-xs: 4px;\n  --radius-sm: 6px;     /* list rows, inputs */\n  --radius-md: 10px;    /* default cards */\n  --radius-lg: 16px;    /* feature cards, panels */\n  --radius-xl: 22px;    /* hero panels */\n  --radius-pill: 999px; /* buttons, chips, badges */\n  --radius-circle: 50%;\n\n  /* ---------- Shadows (neutral, soft, teal-tinted on lift) ---------- */\n  --shadow-xs: 0 1px 2px rgba(7, 29, 38, 0.06);\n  --shadow-sm: 0 2px 5px rgba(7, 29, 38, 0.08);\n  --shadow-md: 0 6px 16px rgba(7, 29, 38, 0.10);\n  --shadow-lg: 0 14px 34px rgba(7, 29, 38, 0.14);\n  --shadow-xl: 0 24px 60px rgba(7, 29, 38, 0.20);\n  --shadow-teal: 0 10px 24px rgba(38, 175, 164, 0.30); /* primary button lift */\n  --shadow-inset: inset 0 1px 0 rgba(255, 255, 255, 0.06);\n\n  /* ---------- Borders ---------- */\n  --border-width: 1px;          /* @kind spacing */\n  --border-width-strong: 2px;   /* @kind spacing */\n  --border-accent-width: 4px;   /* @kind spacing */\n\n  /* ---------- Z-index ---------- */\n  --z-base: 1;       /* @kind other */\n  --z-sticky: 100;   /* @kind other */\n  --z-header: 200;   /* @kind other */\n  --z-overlay: 900;  /* @kind other */\n  --z-modal: 1000;   /* @kind other */\n  --z-toast: 1100;   /* @kind other */\n  --z-chat: 1200;    /* @kind other */\n\n  /* ---------- Motion ---------- */\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);    /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);        /* @kind other */\n  --ease-spring: cubic-bezier(0.25, 0.8, 0.25, 1);  /* @kind other */\n  --dur-fast: 140ms;  /* @kind other */\n  --dur-base: 220ms;  /* @kind other */\n  --dur-slow: 360ms;  /* @kind other */\n\n  /* ---------- Layout constants ---------- */\n  --header-height: 72px;   /* @kind other */\n  --footer-height: 32px;   /* @kind other */\n  --sidebar-width: 288px;  /* @kind other */\n  --container-max: 1280px; /* @kind other */\n}\n\n/* ============================================================\n   BASE — light reset + RTL defaults for Harel Invest\n   Applies brand type + colors to bare HTML.\n   ============================================================ */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-sans);\n  font-weight: var(--fw-regular);\n  font-size: var(--text-base);\n  line-height: var(--leading-normal);\n  color: var(--text-primary);\n  background: var(--surface-page);\n  direction: rtl;\n  text-rendering: optimizeLegibility;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\nh1, h2, h3, h4, h5 {\n  margin: 0;\n  font-weight: var(--fw-extrabold);\n  line-height: var(--leading-tight);\n  color: var(--text-primary);\n  letter-spacing: var(--tracking-tight);\n}\nh1 { font-size: var(--text-2xl); }\nh2 { font-size: var(--text-xl); }\nh3 { font-size: var(--text-lg); font-weight: var(--fw-bold); }\n\np { margin: 0; }\n\na { color: var(--text-brand); text-decoration: none; }\na:hover { color: var(--brand-primary-hover); }\n\nbutton { font-family: inherit; }\n\n:focus-visible { outline: none; box-shadow: var(--ring); border-radius: var(--radius-xs); }\n\n/* Tabular figures for numeric data (prices, yields) */\n.num, [data-numeric] {\n  font-variant-numeric: tabular-nums;\n  font-feature-settings: \"tnum\" 1;\n}\n\n/* Eyebrow / overline helper */\n.overline {\n  font-size: var(--text-xs);\n  font-weight: var(--fw-bold);\n  letter-spacing: var(--tracking-wide);\n  color: var(--text-brand);\n  text-transform: none;\n}\n\n<\u002Fstyle>\n<script src=\"4e3ad930-4f96-406d-850e-afa92cc62148\"><\u002Fscript>\n<script src=\"e4377705-d091-4f03-87c3-e5aa9a844c74\"><\u002Fscript>\n<script src=\"ce804c1d-f6a2-4c6c-a1a3-c53fe3ff132b\"><\u002Fscript>\n<style>\nhtml{-webkit-text-size-adjust:100%;scroll-behavior:smooth}\nbody{margin:0;direction:rtl;background:#07080A;color:#EDEFF2;font-family:Heebo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}\na{color:#E8D38A;text-decoration:none}\na:hover{color:#D4AF37}\ninput,button{font-family:inherit}\nh1,h2,h3,p,label,span,div,li{color:inherit}\nh1,h2,h3{color:#EDEFF2}\n::placeholder{color:#6C757D}\n@keyframes pfPulse{0%,100%{opacity:1}50%{opacity:.55}}\n@keyframes pfGlow{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.5}50%{transform:translate(-50%,-50%) scale(1.15);opacity:.75}}\n@keyframes pfMarquee{from{transform:translateX(0)}to{transform:translateX(50%)}}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div dir=\"rtl\" style=\"max-width:560px;margin:0 auto;padding:0 0 108px;background:#07080A;min-height:100vh;overflow-x:hidden\">\n\n  <header style=\"position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;background:rgba(7,8,10,.94);backdrop-filter:blur(10px);border-bottom:1px solid rgba(212,175,55,.28)\">\n    <img src=\"0a9b17a0-efaf-4939-9c48-4e0efa0e6002\" alt=\"POWER FORCE\" style=\"height:52px;width:auto;display:block;border-radius:8px\">\n    <div style=\"display:flex;gap:8px\">\n      <a href=\"#lead\" style=\"display:flex;align-items:center;gap:7px;height:44px;padding:0 18px;border-radius:999px;background:linear-gradient(135deg,#E8D38A 0%,#D4AF37 100%);color:#07080A;font-size:15px;font-weight:800\">\n        <i data-lucide=\"file-text\" style=\"width:18px;height:18px\"><\u002Fi>\n        בדיקת זכאות\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section style=\"position:relative;overflow:hidden;padding:34px 20px 30px;background:radial-gradient(120% 80% at 80% 0%,rgba(212,175,55,.16) 0%,rgba(7,8,10,0) 60%),#0A0B0E\">\n    <div style=\"position:absolute;top:0;left:50%;width:340px;height:340px;border-radius:999px;background:radial-gradient(circle,rgba(212,175,55,.18),rgba(212,175,55,0) 70%);animation:pfGlow 6s ease-in-out infinite;pointer-events:none\"><\u002Fdiv>\n    <div style=\"position:relative\">\n      <div style=\"display:inline-flex;gap:10px;align-items:center;padding:7px 14px;border-radius:999px;border:1px solid rgba(212,175,55,.4);background:rgba(212,175,55,.08);color:#E8D38A;font-size:13px;font-weight:700;letter-spacing:.2px;animation:pfPulse 2.4s ease-in-out infinite\">\n        <span>✓ מהיר<\u002Fspan><span>✓ פשוט<\u002Fspan><span>✓ ללא התחייבות<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"margin:16px 0 12px;font-size:36px;line-height:1.12;font-weight:900;letter-spacing:-.6px;text-wrap:pretty\">\n        רכב משנת 2012 ומעלה?<br>\n        <span style=\"background:linear-gradient(135deg,#F3E3AD 0%,#D4AF37 60%,#B8932A 100%);-webkit-background-clip:text;background-clip:text;color:transparent\">קבלו הלוואה של עד 200,000 ש\"ח<\u002Fspan><br>\n        תוך יום עסקים אחד!\n      <\u002Fh1>\n      <p style=\"margin:0 0 22px;font-size:17px;line-height:1.55;color:#A8B0B8;text-wrap:pretty\">\n        הלוואה כנגד שעבוד רכב | <strong style=\"color:#EDEFF2;font-weight:800\">פריסה נוחה עד 100 תשלומים<\u002Fstrong> | <strong style=\"color:#EDEFF2;font-weight:800\">הריבית הטובה ביותר בשוק<\u002Fstrong>\n      <\u002Fp>\n      <div style=\"display:grid;gap:10px\">\n        <a href=\"#lead\" style=\"display:flex;align-items:center;justify-content:center;gap:8px;height:56px;border-radius:999px;background:linear-gradient(135deg,#F3E3AD 0%,#D4AF37 55%,#B8932A 100%);color:#07080A;font-size:18px;font-weight:800;box-shadow:0 10px 26px rgba(212,175,55,.28)\">\n          השארת פרטים לבדיקת זכאות ←\n        <\u002Fa>\n        <p style=\"margin:0;text-align:center;font-size:13.5px;color:#7C848B\">בדיקה ללא עלות · ללא התחייבות · תשובה תוך דקות<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"position:relative;margin-top:20px;padding:16px 14px 10px;border-radius:20px;overflow:hidden;background:radial-gradient(90% 120% at 50% 100%,rgba(212,175,55,.16) 0%,rgba(7,8,10,0) 70%),linear-gradient(160deg,#13161B 0%,#0A0B0E 100%);border:1px solid rgba(212,175,55,.3);box-shadow:0 18px 40px rgba(0,0,0,.55)\">\n        <svg sc-camel-view-box=\"0 0 640 250\" style=\"width:100%;height:auto;display:block\" role=\"img\" aria-label=\"איור רכב\">\n          <defs>\n            <linearGradient id=\"pfGold\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n              <stop offset=\"0\" stop-color=\"#F9EFC8\"><\u002Fstop>\n              <stop offset=\"0.42\" stop-color=\"#D4AF37\"><\u002Fstop>\n              <stop offset=\"1\" stop-color=\"#7E6115\"><\u002Fstop>\n            <\u002FlinearGradient>\n            <linearGradient id=\"pfSilver\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n              <stop offset=\"0\" stop-color=\"#FFFFFF\"><\u002Fstop>\n              <stop offset=\"0.5\" stop-color=\"#AEB6BD\"><\u002Fstop>\n              <stop offset=\"1\" stop-color=\"#4E555C\"><\u002Fstop>\n            <\u002FlinearGradient>\n            <linearGradient id=\"pfGlass\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n              <stop offset=\"0\" stop-color=\"#2C3A44\"><\u002Fstop>\n              <stop offset=\"1\" stop-color=\"#0B1016\"><\u002Fstop>\n            <\u002FlinearGradient>\n            <radialGradient id=\"pfFloor\">\n              <stop offset=\"0\" stop-color=\"#D4AF37\" stop-opacity=\"0.4\"><\u002Fstop>\n              <stop offset=\"1\" stop-color=\"#D4AF37\" stop-opacity=\"0\"><\u002Fstop>\n            <\u002FradialGradient>\n          <\u002Fdefs>\n          <ellipse cx=\"330\" cy=\"226\" rx=\"252\" ry=\"17\" fill=\"url(#pfFloor)\"><\u002Fellipse>\n          <g fill=\"#D4AF37\" opacity=\"0.5\">\n            <rect x=\"16\" y=\"120\" width=\"70\" height=\"5\" rx=\"2.5\"><\u002Frect>\n            <rect x=\"34\" y=\"140\" width=\"46\" height=\"5\" rx=\"2.5\"><\u002Frect>\n            <rect x=\"8\" y=\"160\" width=\"56\" height=\"5\" rx=\"2.5\"><\u002Frect>\n          <\u002Fg>\n          <path d=\"M96,192 C88,172 94,152 118,146 L188,130 C214,104 248,84 288,76 C330,67 376,70 408,84 L470,112 L546,128 C584,137 608,152 612,172 C614,183 609,192 598,192 L544,192 A34,34 0 0 1 476,192 L232,192 A34,34 0 0 1 164,192 Z\" fill=\"url(#pfGold)\"><\u002Fpath>\n          <path d=\"M214,132 C236,110 264,95 296,88 C320,83 348,84 368,92 L404,112 Z\" fill=\"url(#pfGlass)\"><\u002Fpath>\n          <path d=\"M382,96 L420,114 L470,126 L436,104 Z\" fill=\"url(#pfGlass)\" opacity=\"0.85\"><\u002Fpath>\n          <path d=\"M120,150 L560,138\" stroke=\"#F9EFC8\" stroke-opacity=\"0.5\" stroke-width=\"2.5\" stroke-linecap=\"round\" fill=\"none\"><\u002Fpath>\n          <rect x=\"586\" y=\"146\" width=\"26\" height=\"12\" rx=\"6\" fill=\"#FFF6DA\"><\u002Frect>\n          <rect x=\"98\" y=\"158\" width=\"20\" height=\"10\" rx=\"5\" fill=\"#E1493B\" opacity=\"0.9\"><\u002Frect>\n          <g>\n            <circle cx=\"198\" cy=\"192\" r=\"36\" fill=\"#0E1216\" stroke=\"#D4AF37\" stroke-width=\"3\"><\u002Fcircle>\n            <circle cx=\"198\" cy=\"192\" r=\"17\" fill=\"url(#pfSilver)\" opacity=\"0.75\"><\u002Fcircle>\n            <circle cx=\"510\" cy=\"192\" r=\"36\" fill=\"#0E1216\" stroke=\"#D4AF37\" stroke-width=\"3\"><\u002Fcircle>\n            <circle cx=\"510\" cy=\"192\" r=\"17\" fill=\"url(#pfSilver)\" opacity=\"0.75\"><\u002Fcircle>\n          <\u002Fg>\n        <\u002Fsvg>\n        <div style=\"display:flex;align-items:center;justify-content:center;gap:8px;margin-top:2px;padding:8px 12px;border-radius:999px;background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.28);color:#E8D38A;font-size:13.5px;font-weight:700\">\n          הרכב נשאר אצלכם · ממשיכים לנסוע כרגיל\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(212,175,55,.18);border-top:1px solid rgba(212,175,55,.18);border-bottom:1px solid rgba(212,175,55,.18)\">\n    <div style=\"padding:18px 12px;text-align:center;background:#0A0B0E\">\n      <div style=\"font-size:30px;font-weight:900;color:#E8D38A;font-variant-numeric:tabular-nums\">200K ₪<\u002Fdiv>\n      <div style=\"font-size:13px;color:#8D959D;margin-top:2px\">הלוואה עד<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:18px 12px;text-align:center;background:#0A0B0E\">\n      <div style=\"font-size:30px;font-weight:900;color:#E8D38A;font-variant-numeric:tabular-nums\">100<\u002Fdiv>\n      <div style=\"font-size:13px;color:#8D959D;margin-top:2px\">תשלומים עד<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:18px 12px;text-align:center;background:#0A0B0E\">\n      <div style=\"font-size:30px;font-weight:900;color:#E8D38A;font-variant-numeric:tabular-nums\">1<\u002Fdiv>\n      <div style=\"font-size:13px;color:#8D959D;margin-top:2px\">יום עסקים<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:18px 12px;text-align:center;background:#0A0B0E\">\n      <div style=\"font-size:30px;font-weight:900;color:#E8D38A;font-variant-numeric:tabular-nums\">0 ₪<\u002Fdiv>\n      <div style=\"font-size:13px;color:#8D959D;margin-top:2px\">עלות בדיקה<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ showCalculator }}\" hint-placeholder-val=\"{{ true }}\">\n  <section id=\"simulator\" style=\"margin:20px 16px;padding:20px 18px;border-radius:16px;background:#101216;border:1px solid rgba(255,255,255,.08)\">\n    <h2 style=\"margin:0 0 4px;font-size:21px;font-weight:800;line-height:1.3\">מחשבון הלוואה<\u002Fh2>\n    <p style=\"margin:0 0 18px;font-size:15px;color:#8D959D\">גלו כמה כסף הרכב שלכם שווה<\u002Fp>\n    <label for=\"car-value\" style=\"display:block;font-size:14px;font-weight:600;color:#C3CAD1;margin-bottom:6px\">שווי הרכב (לפי מחירון):<\u002Flabel>\n    <input id=\"car-value\" ref=\"{{ valueRef }}\" type=\"number\" sc-camel-input-mode=\"numeric\" min=\"20000\" placeholder=\"לדוגמה: 80000\" style=\"width:100%;box-sizing:border-box;height:52px;padding:0 14px;margin-bottom:14px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:#15181D;color:#EDEFF2;font-size:17px\" style-focus=\"border-color:#D4AF37;outline:none;box-shadow:0 0 0 3px rgba(212,175,55,.22)\">\n    <label for=\"car-year\" style=\"display:block;font-size:14px;font-weight:600;color:#C3CAD1;margin-bottom:6px\">שנתון הרכב:<\u002Flabel>\n    <input id=\"car-year\" ref=\"{{ yearRef }}\" type=\"number\" sc-camel-input-mode=\"numeric\" min=\"2012\" max=\"2026\" placeholder=\"2012-2026\" style=\"width:100%;box-sizing:border-box;height:52px;padding:0 14px;margin-bottom:18px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:#15181D;color:#EDEFF2;font-size:17px\" style-focus=\"border-color:#D4AF37;outline:none;box-shadow:0 0 0 3px rgba(212,175,55,.22)\">\n    <button type=\"button\" sc-camel-on-click=\"{{ calc }}\" style=\"width:100%;height:54px;border:0;border-radius:999px;background:linear-gradient(135deg,#F3E3AD 0%,#D4AF37 55%,#B8932A 100%);color:#07080A;font-size:17px;font-weight:800;cursor:pointer\">\n      חשבו לי זכאות\n    <\u002Fbutton>\n    <sc-if value=\"{{ calcError }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:16px;padding:14px;border-radius:12px;background:rgba(225,73,59,.12);border:1px solid rgba(225,73,59,.4);color:#F3A9A1;font-size:15px;line-height:1.5\">\n        אנא מלאו ערכים תקינים. שווי רכב מינימלי 20,000 ₪, שנתון מ-2012 ומעלה.\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ calcAmount }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:16px;padding:18px;border-radius:12px;background:rgba(24,160,91,.1);border:1px solid rgba(24,160,91,.4);text-align:center\">\n        <p style=\"margin:0 0 6px;font-size:15px;color:#A8B0B8\">ההלוואה המקסימלית שתוכלו לקבל מוערכת בכ-<\u002Fp>\n        <p style=\"margin:0 0 8px;font-size:32px;font-weight:900;color:#E8D38A;font-variant-numeric:tabular-nums\">{{ calcAmount }} ₪<\u002Fp>\n        <p style=\"margin:0 0 14px;font-size:14px;color:#8D959D;line-height:1.5\">זוהי הערכה בלבד. לקבלת הצעה מדויקת, השאירו פרטים ונדבר.<\u002Fp>\n        <a href=\"#lead\" style=\"display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 22px;border-radius:999px;background:rgba(212,175,55,.14);border:1px solid rgba(212,175,55,.5);color:#E8D38A;font-weight:700;font-size:16px\">השארת פרטים<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <section style=\"padding:24px 16px 8px\">\n    <h2 style=\"margin:0 0 18px;font-size:25px;font-weight:900;line-height:1.25;text-wrap:pretty\">התהליך פשוט, מהיר וללא התחייבות<\u002Fh2>\n    <div style=\"display:grid;gap:12px\">\n      <div style=\"display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:14px;background:#101216;border:1px solid rgba(255,255,255,.07)\">\n        <div style=\"flex:none;display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:999px;background:linear-gradient(135deg,#F3E3AD,#D4AF37);color:#07080A;font-size:20px;font-weight:900\">1<\u002Fdiv>\n        <div>\n          <h3 style=\"margin:0 0 4px;font-size:18px;font-weight:800\">ממלאים פרטים<\u002Fh3>\n          <p style=\"margin:0;font-size:15px;line-height:1.55;color:#98A0A8\">משאירים פרטים בטופס או מתקשרים אלינו לבדיקה ראשונית ומהירה.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:14px;background:#101216;border:1px solid rgba(255,255,255,.07)\">\n        <div style=\"flex:none;display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:999px;background:linear-gradient(135deg,#F3E3AD,#D4AF37);color:#07080A;font-size:20px;font-weight:900\">2<\u002Fdiv>\n        <div>\n          <h3 style=\"margin:0 0 4px;font-size:18px;font-weight:800\">בדיקה ללא עלות<\u002Fh3>\n          <p style=\"margin:0;font-size:15px;line-height:1.55;color:#98A0A8\">נציג מומחה בודק את זכאותכם מול <strong style=\"color:#E8D38A;font-weight:800\">כל חברות המימון<\u002Fstrong> וחוזר עם תשובה.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:14px;background:#101216;border:1px solid rgba(255,255,255,.07)\">\n        <div style=\"flex:none;display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:999px;background:linear-gradient(135deg,#F3E3AD,#D4AF37);color:#07080A;font-size:20px;font-weight:900\">3<\u002Fdiv>\n        <div>\n          <h3 style=\"margin:0 0 4px;font-size:18px;font-weight:800\">מקבלים את הכסף<\u002Fh3>\n          <p style=\"margin:0;font-size:15px;line-height:1.55;color:#98A0A8\">לאחר אישור סופי וחתימה, הכסף מועבר ישירות לחשבון הבנק שלכם <strong style=\"color:#E8D38A;font-weight:800\">תוך יום עסקים<\u002Fstrong>.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:24px 16px 4px\">\n    <h2 style=\"margin:0 0 18px;font-size:25px;font-weight:900;line-height:1.25;text-wrap:pretty\">למה לבחור בנו? כי אצלנו עובדים אחרת<\u002Fh2>\n    <div style=\"display:grid;gap:14px\">\n      <div style=\"display:flex;gap:14px;align-items:flex-start\">\n        <div style=\"flex:none;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.28);color:#E8D38A\">\n          <i data-lucide=\"clock\" style=\"width:22px;height:22px\"><\u002Fi>\n        <\u002Fdiv>\n        <div>\n          <h3 style=\"margin:0 0 3px;font-size:17px;font-weight:800\">תוך יום עסקים<\u002Fh3>\n          <p style=\"margin:0;font-size:15px;line-height:1.55;color:#98A0A8\">הזמן שלכם יקר. לכן הכסף אצלכם בחשבון <strong style=\"color:#E8D38A;font-weight:800\">תוך יום עסקים אחד<\u002Fstrong> מהאישור.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:14px;align-items:flex-start\">\n        <div style=\"flex:none;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.28);color:#E8D38A\">\n          <i data-lucide=\"shield-check\" style=\"width:22px;height:22px\"><\u002Fi>\n        <\u002Fdiv>\n        <div>\n          <h3 style=\"margin:0 0 3px;font-size:17px;font-weight:800\">בדיקה חינם וללא התחייבות<\u002Fh3>\n          <p style=\"margin:0;font-size:15px;line-height:1.55;color:#98A0A8\">בדיקת הזכאות היא <strong style=\"color:#E8D38A;font-weight:800\">בחינם לגמרי<\u002Fstrong>. אין לכם מה להפסיד.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:14px;align-items:flex-start\">\n        <div style=\"flex:none;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.28);color:#E8D38A\">\n          <i data-lucide=\"badge-check\" style=\"width:22px;height:22px\"><\u002Fi>\n        <\u002Fdiv>\n        <div>\n          <h3 style=\"margin:0 0 3px;font-size:17px;font-weight:800\">עובדים על בסיס הצלחה בלבד<\u002Fh3>\n          <p style=\"margin:0;font-size:15px;line-height:1.55;color:#98A0A8\">אנחנו עובדים <strong style=\"color:#E8D38A;font-weight:800\">רק על בסיס הצלחה<\u002Fstrong>. קיבלתם את הכסף? רק אז התהליך הושלם.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:14px;align-items:flex-start\">\n        <div style=\"flex:none;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.28);color:#E8D38A\">\n          <i data-lucide=\"users\" style=\"width:22px;height:22px\"><\u002Fi>\n        <\u002Fdiv>\n        <div>\n          <h3 style=\"margin:0 0 3px;font-size:17px;font-weight:800\">קשרים עם כל גופי המימון<\u002Fh3>\n          <p style=\"margin:0;font-size:15px;line-height:1.55;color:#98A0A8\">אנו עובדים עם כל חברות השעבוד הגדולות בישראל כדי להשיג לכם את התנאים הטובים ביותר.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:14px;align-items:flex-start\">\n        <div style=\"flex:none;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.28);color:#E8D38A\">\n          <i data-lucide=\"truck\" style=\"width:22px;height:22px\"><\u002Fi>\n        <\u002Fdiv>\n        <div>\n          <h3 style=\"margin:0 0 3px;font-size:17px;font-weight:800\">גם למשאיות<\u002Fh3>\n          <p style=\"margin:0;font-size:15px;line-height:1.55;color:#98A0A8\">אפשרות מימון למשאיות עד 12 טון בבעלות פרטית.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"margin:26px 0 0;padding:24px 0 26px;background:linear-gradient(180deg,#0A0B0E 0%,#0D0F13 100%);border-top:1px solid rgba(212,175,55,.18);border-bottom:1px solid rgba(212,175,55,.18)\">\n    <div style=\"padding:0 16px\">\n      <h2 style=\"margin:0 0 6px;font-size:25px;font-weight:900;line-height:1.25;text-wrap:pretty\">עובדים עם כל חברות המימון בישראל<\u002Fh2>\n      <p style=\"margin:0 0 18px;font-size:15px;line-height:1.55;color:#98A0A8\">אנחנו מריצים את הבקשה שלכם <strong style=\"color:#EDEFF2;font-weight:800\">במקביל אצל כל הגופים<\u002Fstrong> ובוחרים את <strong style=\"color:#EDEFF2;font-weight:800\">ההצעה הזולה ביותר<\u002Fstrong> עבורכם.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:10px;overflow-x:auto;padding:0 16px 14px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch\">\n      <div style=\"flex:0 0 132px;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;height:82px;padding:12px;border-radius:16px;background:#FFFFFF;border:1px solid rgba(212,175,55,.26);box-shadow:0 8px 20px rgba(0,0,0,.35)\">\n        <img src=\"4e9f2c61-816c-4d8c-a276-0a6c15d324b5\" alt=\"פמה\" style=\"max-width:100%;max-height:56px;object-fit:contain;display:block\">\n      <\u002Fdiv>\n      <div style=\"flex:0 0 132px;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;height:82px;padding:12px;border-radius:16px;background:#FFFFFF;border:1px solid rgba(212,175,55,.26);box-shadow:0 8px 20px rgba(0,0,0,.35)\">\n        <img src=\"1ed38a6e-3453-457a-9845-bd9f6c695b14\" alt=\"freesbe\" style=\"max-width:100%;max-height:38px;object-fit:contain;display:block\">\n      <\u002Fdiv>\n      <div style=\"flex:0 0 132px;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;height:82px;padding:12px;border-radius:16px;background:#FFFFFF;border:1px solid rgba(212,175,55,.26);box-shadow:0 8px 20px rgba(0,0,0,.35)\">\n        <img src=\"47ba8065-de00-434f-ba64-734ce1481841\" alt=\"מימון ישיר\" style=\"max-width:100%;max-height:50px;object-fit:contain;display:block\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"overflow:hidden;-webkit-mask-image:linear-gradient(to left,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(to left,transparent,#000 12%,#000 88%,transparent)\">\n      <div style=\"display:flex;width:max-content;gap:10px;animation:pfMarquee 26s linear infinite\">\n        <div style=\"display:flex;gap:10px\">\n          <span style=\"display:flex;align-items:center;height:46px;padding:0 18px;border-radius:999px;background:#15181D;border:1px solid rgba(212,175,55,.22);color:#D8DEE4;font-size:16px;font-weight:700;white-space:nowrap\">מימון ישיר<\u002Fspan>\n          <span style=\"display:flex;align-items:center;height:46px;padding:0 18px;border-radius:999px;background:#15181D;border:1px solid rgba(212,175,55,.22);color:#D8DEE4;font-size:16px;font-weight:700;white-space:nowrap\">אופל בלאנס<\u002Fspan>\n          <span style=\"display:flex;align-items:center;height:46px;padding:0 18px;border-radius:999px;background:#15181D;border:1px solid rgba(212,175,55,.22);color:#D8DEE4;font-size:16px;font-weight:700;white-space:nowrap\">גמא ניהול וסליקה<\u002Fspan>\n          <span style=\"display:flex;align-items:center;height:46px;padding:0 18px;border-radius:999px;background:#15181D;border:1px solid rgba(212,175,55,.22);color:#D8DEE4;font-size:16px;font-weight:700;white-space:nowrap\">פנינסולה<\u002Fspan>\n          <span style=\"display:flex;align-items:center;height:46px;padding:0 18px;border-radius:999px;background:#15181D;border:1px solid rgba(212,175,55,.22);color:#D8DEE4;font-size:16px;font-weight:700;white-space:nowrap\">ערד פיננסים<\u002Fspan>\n          <span style=\"display:flex;align-items:center;height:46px;padding:0 18px;border-radius:999px;background:#15181D;border:1px solid rgba(212,175,55,.22);color:#D8DEE4;font-size:16px;font-weight:700;white-space:nowrap\">אס.אר. אקורד<\u002Fspan>\n          <span style=\"display:flex;align-items:center;height:46px;padding:0 18px;border-radius:999px;background:#15181D;border:1px solid rgba(212,175,55,.22);color:#D8DEE4;font-size:16px;font-weight:700;white-space:nowrap\">אחים נאוי<\u002Fspan>\n          <span style=\"display:flex;align-items:center;height:46px;padding:0 18px;border-radius:999px;background:#15181D;border:1px solid rgba(212,175,55,.22);color:#D8DEE4;font-size:16px;font-weight:700;white-space:nowrap\">ברק קפיטל<\u002Fspan>\n          <span style=\"display:flex;align-items:center;height:46px;padding:0 18px;border-radius:999px;background:#15181D;border:1px solid rgba(212,175,55,.22);color:#D8DEE4;font-size:16px;font-weight:700;white-space:nowrap\">טריא<\u002Fspan>\n          <span style=\"display:flex;align-items:center;height:46px;padding:0 18px;border-radius:999px;background:#15181D;border:1px solid rgba(212,175,55,.22);color:#D8DEE4;font-size:16px;font-weight:700;white-space:nowrap\">קרדיט קפיטל<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px\" aria-hidden=\"true\">\n          <span style=\"display:flex;align-items:center;height:46px;padding:0 18px;border-radius:999px;background:#15181D;border:1px solid rgba(212,175,55,.22);color:#D8DEE4;font-size:16px;font-weight:700;white-space:nowrap\">מימון ישיר<\u002Fspan>\n          <span style=\"display:flex;align-items:center;height:46px;padding:0 18px;border-radius:999px;background:#15181D;border:1px solid rgba(212,175,55,.22);color:#D8DEE4;font-size:16px;font-weight:700;white-space:nowrap\">אופל בלאנס<\u002Fspan>\n          <span style=\"display:flex;align-items:center;height:46px;padding:0 18px;border-radius:999px;background:#15181D;border:1px solid rgba(212,175,55,.22);color:#D8DEE4;font-size:16px;font-weight:700;white-space:nowrap\">גמא ניהול וסליקה<\u002Fspan>\n          <span style=\"display:flex;align-items:center;height:46px;padding:0 18px;border-radius:999px;background:#15181D;border:1px solid rgba(212,175,55,.22);color:#D8DEE4;font-size:16px;font-weight:700;white-space:nowrap\">פנינסולה<\u002Fspan>\n          <span style=\"display:flex;align-items:center;height:46px;padding:0 18px;border-radius:999px;background:#15181D;border:1px solid rgba(212,175,55,.22);color:#D8DEE4;font-size:16px;font-weight:700;white-space:nowrap\">ערד פיננסים<\u002Fspan>\n          <span style=\"display:flex;align-items:center;height:46px;padding:0 18px;border-radius:999px;background:#15181D;border:1px solid rgba(212,175,55,.22);color:#D8DEE4;font-size:16px;font-weight:700;white-space:nowrap\">אס.אר. אקורד<\u002Fspan>\n          <span style=\"display:flex;align-items:center;height:46px;padding:0 18px;border-radius:999px;background:#15181D;border:1px solid rgba(212,175,55,.22);color:#D8DEE4;font-size:16px;font-weight:700;white-space:nowrap\">אחים נאוי<\u002Fspan>\n          <span style=\"display:flex;align-items:center;height:46px;padding:0 18px;border-radius:999px;background:#15181D;border:1px solid rgba(212,175,55,.22);color:#D8DEE4;font-size:16px;font-weight:700;white-space:nowrap\">ברק קפיטל<\u002Fspan>\n          <span style=\"display:flex;align-items:center;height:46px;padding:0 18px;border-radius:999px;background:#15181D;border:1px solid rgba(212,175,55,.22);color:#D8DEE4;font-size:16px;font-weight:700;white-space:nowrap\">טריא<\u002Fspan>\n          <span style=\"display:flex;align-items:center;height:46px;padding:0 18px;border-radius:999px;background:#15181D;border:1px solid rgba(212,175,55,.22);color:#D8DEE4;font-size:16px;font-weight:700;white-space:nowrap\">קרדיט קפיטל<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"lead\" style=\"margin:26px 16px 0;padding:24px 18px;border-radius:18px;background:linear-gradient(160deg,#13161B 0%,#0A0B0E 100%);border:1px solid rgba(212,175,55,.3);scroll-margin-top:76px\">\n    <h2 style=\"margin:0 0 6px;font-size:26px;font-weight:900;line-height:1.25;text-align:center\">מוכנים לקבל את הכסף?<\u002Fh2>\n    <p style=\"margin:0 0 20px;font-size:16px;color:#98A0A8;text-align:center;line-height:1.5\">השאירו פרטים ונחזור אליכם <strong style=\"color:#E8D38A;font-weight:800\">תוך דקות<\u002Fstrong> עם כל מה שצריך לדעת.<\u002Fp>\n    <form sc-camel-on-submit=\"{{ submit }}\">\n      <label for=\"form-name\" style=\"display:block;font-size:14px;font-weight:600;color:#C3CAD1;margin-bottom:6px\">שם מלא:<\u002Flabel>\n      <input id=\"form-name\" name=\"name\" type=\"text\" placeholder=\"השם שלך\" required=\"\" style=\"width:100%;box-sizing:border-box;height:52px;padding:0 14px;margin-bottom:14px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:#15181D;color:#EDEFF2;font-size:17px\" style-focus=\"border-color:#D4AF37;outline:none;box-shadow:0 0 0 3px rgba(212,175,55,.22)\">\n      <label for=\"form-phone\" style=\"display:block;font-size:14px;font-weight:600;color:#C3CAD1;margin-bottom:6px\">טלפון:<\u002Flabel>\n      <input id=\"form-phone\" name=\"phone\" type=\"tel\" sc-camel-input-mode=\"tel\" placeholder=\"050-1234567\" required=\"\" style=\"width:100%;box-sizing:border-box;height:52px;padding:0 14px;margin-bottom:14px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:#15181D;color:#EDEFF2;font-size:17px\" style-focus=\"border-color:#D4AF37;outline:none;box-shadow:0 0 0 3px rgba(212,175,55,.22)\">\n      <label for=\"form-email\" style=\"display:block;font-size:14px;font-weight:600;color:#C3CAD1;margin-bottom:6px\">אימייל (אופציונלי):<\u002Flabel>\n      <input id=\"form-email\" name=\"email\" type=\"email\" sc-camel-input-mode=\"email\" placeholder=\"your@email.com\" style=\"width:100%;box-sizing:border-box;height:52px;padding:0 14px;margin-bottom:16px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:#15181D;color:#EDEFF2;font-size:17px\" style-focus=\"border-color:#D4AF37;outline:none;box-shadow:0 0 0 3px rgba(212,175,55,.22)\">\n      <label for=\"consent\" style=\"display:flex;gap:10px;align-items:flex-start;margin-bottom:18px;font-size:14px;line-height:1.5;color:#98A0A8;cursor:pointer\">\n        <input id=\"consent\" name=\"consent\" type=\"checkbox\" sc-camel-default-checked=\"{{ true }}\" style=\"flex:none;width:20px;height:20px;margin:1px 0 0;accent-color:#D4AF37\">\n        <span>אני מאשר/ת יצירת קשר וקבלת דיוור שיווקי.<\u002Fspan>\n      <\u002Flabel>\n      <p style=\"margin:-6px 0 18px;font-size:11.5px;line-height:1.65;color:#6C757D;text-align:right\">\n        בסימון התיבה ובשליחת הפרטים אני מאשר/ת, ביודעין ומרצוני החופשי, כי החברה ו/או מי מטעמה, וכן חברות המימון וגופי האשראי שאליהם תועבר בקשתי, יצרו עמי קשר בכל אמצעי — שיחת טלפון, מסרון (SMS), דואר אלקטרוני, פקסימיליה או מערכת מתקשרת אוטומטית — לצורך בדיקת זכאותי, הצגת הצעות מימון וקידום העסקה, וכן לצורך משלוח דבר פרסומת כמשמעותו בסעיף 30א לחוק התקשורת (בזק ושידורים), התשמ\"ב-1982. אישור זה מהווה הסכמה מלאה ומפורשת לפנייה אליי, לרישום פרטיי במאגר המידע של החברה ולעיבודם בהתאם לחוק הגנת הפרטיות, התשמ\"א-1981. מסירת הפרטים נעשית מרצון ואינה מחויבת על פי דין. באפשרותי לחזור מהסכמתי ולבקש הסרה מרשימת הדיוור בכל עת, בהודעה בכתב או בדרך שבה שוגר אליי המשלוח, ובקשתי תטופל בהתאם לדין.\n      <\u002Fp>\n      <button type=\"submit\" disabled=\"{{ sending }}\" style=\"width:100%;height:58px;border:0;border-radius:999px;background:linear-gradient(135deg,#F3E3AD 0%,#D4AF37 55%,#B8932A 100%);color:#07080A;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 10px 26px rgba(212,175,55,.24)\">\n        {{ submitLabel }}\n      <\u002Fbutton>\n      <sc-if value=\"{{ okMsg }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"margin:14px 0 0;text-align:center;font-size:16px;font-weight:700;color:#4FD18C\">תודה! הפרטים נשלחו בהצלחה. ניצור קשר בהקדם.<\u002Fp>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ errMsg }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"margin:14px 0 0;text-align:center;font-size:16px;font-weight:700;color:#F3A9A1\">אופס! משהו השתבש. אנא נסו לשלוח שוב בעוד רגע.<\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fform>\n  <\u002Fsection>\n\n  <footer style=\"padding:28px 18px 8px;margin-top:24px;border-top:1px solid rgba(255,255,255,.08);text-align:center\">\n    <p style=\"margin:0 0 10px;font-size:12px;line-height:1.6;color:#7C848B\">המימון ניתן באמצעות חברות מימון חוץ בנקאיות מובילות. אנו חברת שיווק המשמשת כגורם מקשר ומתאם בלבד. | כל התנאים כפופים לאישור החברה המממנת ותנאיה.<\u002Fp>\n    <p style=\"margin:0 0 10px;font-size:12px;line-height:1.6;font-weight:700;color:#E1493B\">אי עמידה בפירעון ההלוואה או בהחזר האשראי עלולה לגרור חיוב בריבית פיגורים והליכי הוצאה לפועל.<\u002Fp>\n    <p style=\"margin:0;font-size:12px;color:#7C848B\">© כל הזכויות שמורות, {{ year }}.<\u002Fp>\n  <\u002Ffooter>\n\n  <sc-if value=\"{{ showStickyBar }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"position:fixed;bottom:0;right:0;left:0;z-index:60;display:grid;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(7,8,10,.95);backdrop-filter:blur(12px);border-top:1px solid rgba(212,175,55,.28)\">\n    <a href=\"#lead\" style=\"display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:999px;background:linear-gradient(135deg,#F3E3AD 0%,#D4AF37 55%,#B8932A 100%);color:#07080A;font-size:17px;font-weight:800;box-shadow:0 8px 22px rgba(212,175,55,.26)\">\n      השארת פרטים לבדיקת זכאות ←\n    <\u002Fa>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:932},&quot;showCalculator&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showStickyBar&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;maxLoan&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:200000,&quot;min&quot;:50000,&quot;max&quot;:500000,&quot;step&quot;:10000,&quot;unit&quot;:&quot;₪&quot;,&quot;tsType&quot;:&quot;number&quot;}}\">\nclass Component extends DCLogic {\n  state = { calcAmount: null, calcError: false, sending: false, okMsg: false, errMsg: false };\n\n  valueRef = React.createRef();\n  yearRef = React.createRef();\n\n  componentDidMount() { this.icons(); }\n  componentDidUpdate() { this.icons(); }\n  icons() { try { window.lucide && window.lucide.createIcons(); } catch (e) {} }\n\n  calc = () => {\n    const value = parseInt(this.valueRef.current && this.valueRef.current.value, 10) || 0;\n    const year = parseInt(this.yearRef.current && this.yearRef.current.value, 10) || 0;\n    const now = new Date().getFullYear();\n    if (value < 20000 || year < 2012 || year > now + 1) {\n      this.setState({ calcError: true, calcAmount: null });\n      return;\n    }\n    const max = this.props.maxLoan ?? 200000;\n    const amount = Math.min(Math.floor(value * 0.85), max);\n    this.setState({ calcError: false, calcAmount: amount.toLocaleString('en-US') });\n  };\n\n  submit = async (e) => {\n    e.preventDefault();\n    const form = e.target;\n    const url = 'https://script.google.com/macros/s/AKfycbx4tiPtY1iHlQGeKQbIWGcR_1PS03M7HH2fzF_IhA3DiS8r_zAct8Jq2zJHg5f0XVM7/exec';\n    this.setState({ sending: true, okMsg: false, errMsg: false });\n    try {\n      const res = await fetch(url, { method: 'POST', body: new FormData(form) });\n      if (!res.ok) throw new Error('network');\n      const data = await res.json();\n      if (data.result !== 'success') throw new Error(data.message || 'error');\n      form.reset();\n      this.setState({ sending: false, okMsg: true });\n    } catch (err) {\n      this.setState({ sending: false, errMsg: true });\n    }\n  };\n\n  renderVals() {\n    return {\n      showCalculator: this.props.showCalculator ?? true,\n      showStickyBar: this.props.showStickyBar ?? true,\n      calcAmount: this.state.calcAmount,\n      calcError: this.state.calcError,\n      calc: this.calc,\n      submit: this.submit,\n      sending: this.state.sending,\n      submitLabel: this.state.sending ? 'שולח...' : 'שלחו בקשה עכשיו →',\n      okMsg: this.state.okMsg,\n      errMsg: this.state.errMsg,\n      year: new Date().getFullYear()\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
