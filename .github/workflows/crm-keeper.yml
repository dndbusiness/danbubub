# "השומר" של ה-CRM (scripts/crm-keeper.mjs): פותח את הדף בדפדפן בלי אדם כל חצי שעה, כדי שסנכרון טבלאות
# הלידים, סימון הכפולים, אירועי היומן והגיבוי היומי לדרייב ירוצו גם כשאף אחד לא בתוך המערכת.
# לא ג'וב חדש — אותן אוטומציות שהדף כבר מריץ כשמישהו בפנים (הנחיה 14), עכשיו בלי תלות בדפדפן פתוח. ממתין לאישור דן.
# מדלג לבד כל עוד המערכת במצב שכפול (הדף ב-Claude הוא המקור).
# נדרש: secrets APP_BASE_URL ו-APP_PASSWORD במאגר. תזמון ב-GitHub רץ רק מהענף הראשי (main).
name: crm-keeper

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: crm-keeper
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: פתיחת ה-CRM והרצת הסנכרון והגיבוי
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: node scripts/crm-keeper.mjs
